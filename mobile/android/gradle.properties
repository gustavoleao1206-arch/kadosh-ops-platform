org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilação incremental do Kotlin desligada.
#
# Ela mantém caches `.tab` abertos dentro da pasta de build, e com um antivírus segurando o
# handle o build morre com "Could not close incremental caches". Sem incremental esses
# arquivos não existem. Custo: recompilação completa a cada build, o que para um app deste
# tamanho é questão de segundos.
kotlin.incremental=false
